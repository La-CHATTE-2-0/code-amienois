sonar.projectKey=La-CHATTE-2-0_code-amienois
sonar.organization=la-chatte-2-0

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=code-amienois
#sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Code source et tests (les specs vivent à côté du code dans src/)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=src/**/*.spec.ts

# Couverture produite par `npm run test:coverage` (Vitest + v8)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/test/**,src/**/*.d.ts
