sonar.projectKey=La-CHATTE-2-0_code-amienois
sonar.organization=la-chatte-2-0

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=code-amienois
#sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Code source et tests (les specs vivent dans tests/, en miroir de src/)
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts

# Couverture produite par `npm run test:coverage` (Vitest + v8)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/**/*.d.ts

# « !important » assumés (css:S9423), seuls à pouvoir surpasser un style inline ou tout le reste :
# - style.css : neutralisation des animations quand l'utilisateur demande moins de mouvement
# - GuideCouture.vue : à l'impression, dépliage des panneaux masqués en ligne par v-show
sonar.issue.ignore.multicriteria=importantReducedMotion,importantPrint
sonar.issue.ignore.multicriteria.importantReducedMotion.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.importantReducedMotion.resourceKey=src/style.css
sonar.issue.ignore.multicriteria.importantPrint.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.importantPrint.resourceKey=src/pages/ressources/GuideCouture.vue
