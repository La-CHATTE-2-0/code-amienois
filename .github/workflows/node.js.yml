# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
    push:
        branches: ["main"]
    pull_request:
        types: [opened, synchronize, reopened]
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [26.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
              with:
                  # Historique complet : Sonar en a besoin pour le blame et la détection du « new code »
                  fetch-depth: 0
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci --ignore-scripts
            - run: npm run test:coverage
            - run: npm run build --if-present
            - name: SonarQube Cloud Scan
              # Les PR venant de forks n'ont pas accès au secret SONAR_TOKEN
              if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
              uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
